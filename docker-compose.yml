services:
  postgres:
    image: postgres:16-alpine
    container_name: roomreservas-db
    environment:
      POSTGRES_DB: roomreservas
      POSTGRES_USER: roomreservas
      POSTGRES_PASSWORD: roomreservas
    ports:
      - "5432:5432"
    volumes:
      - roomreservas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomreservas -d roomreservas"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roomreservas-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/roomreservas
      SPRING_DATASOURCE_USERNAME: roomreservas
      SPRING_DATASOURCE_PASSWORD: roomreservas
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  roomreservas_pgdata:
